port = 8000
data_dir = "data"

# ?mode=rwc standa for read/write/create. by setting this flag,
# we make sqlite create the .db file if it doesn't exist
database_url = "sqlite:./moneymentum.db?mode=rwc"

log_level = "debug"

# Ingestion tuning - balance speed vs rate limiting
max_concurrent_requests = 3
max_retries = 5

# Derive (Lyra) options integration.
# Options chain routes mount on the main moneymentum HTTP port when present.
# `port` is only used by the standalone `derive_cli` binary.
[derive]
port = 8100
rest_base_url = "https://api.lyra.finance"
ws_url = "wss://api.lyra.finance/ws"
testnet_rest_base_url = "https://api-demo.lyra.finance"
testnet_ws_url = "wss://api-demo.lyra.finance/ws"
